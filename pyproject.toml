[project]
name = "mini-rag-reader"
version = "0.1.0"
description = "Mini-RAG Reader — Retrieval-Augmented Generation system with PDF/text upload, semantic search, and LLM-powered Q&A."
requires-python = ">=3.11"
dependencies = [
  "sentence-transformers>=3.0",
  "faiss-cpu>=1.8",
  "pdfplumber>=0.10",
  "pypdf>=4.0",
  "pydantic>=2.6",
  "pyyaml>=6.0",
  "numpy>=1.26",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "ruff>=0.6",
  "mypy>=1.10",
]
serve = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "python-multipart>=0.0.9",
  "aiofiles>=23",
]
hf = [
  "torch>=2.0",
  "transformers>=4.42",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B", "UP", "N", "SIM"]
ignore = ["E501"]  # handled by formatter

[tool.ruff.lint.per-file-ignores]
"notebooks/*" = ["E402", "B018"]  # notebooks allow inline imports and broad excepts

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.mypy]
python_version = "3.11"
strict_optional = true
warn_unused_ignores = true
warn_redundant_casts = true
